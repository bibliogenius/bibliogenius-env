services:
  # Rust Server (Port 8001)
  bibliogenius:
    build:
      context: ../bibliogenius
      dockerfile: Dockerfile
    container_name: bibliogenius
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:///app/data/bibliogenius.db?mode=rwc
      - PORT=8000
      - HUB_URL=http://hub:80
    volumes:
      - bibliogenius-data:/app/data
    networks:
      - bibliogenius-network
    restart: unless-stopped

  # Central Symfony Hub (registry, discovery, relay)
  hub:
    build:
      context: ../bibliogenius-hub
      dockerfile: Dockerfile
    container_name: bibliogenius-hub
    ports:
      - "8081:80"
    volumes:
      - ../bibliogenius-hub:/app
      - hub-data:/app/var/data
    environment:
      - APP_ENV=dev
      - APP_SECRET=change_this_in_production
      - DATABASE_URL=sqlite:////app/var/data/hub.db
      - SERVER_NAME=:80
      - DEFAULT_URI=http://localhost
      - CORS_ALLOW_ORIGIN=^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
    networks:
      - bibliogenius-network
    restart: unless-stopped

  builder:
    build:
      context: ../bibliogenius
      dockerfile: Dockerfile
      target: builder
    container_name: bibliogenius-builder
    volumes:
      - ../bibliogenius:/app
    working_dir: /app
    command: cargo fetch

  # Flutter Linux app testing
  # Usage:
  #   Smoke test:    docker compose run --rm linux-app smoke
  #   API testing:   docker compose run --rm -d --service-ports linux-app
  #   VNC (browser): docker compose run --rm --service-ports linux-app vnc
  #                  then open http://localhost:6080/vnc.html
  linux-app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.linux-app
    container_name: bibliogenius-linux-app
    volumes:
      - ../_ressources/bundle:/app
    ports:
      - "8042:8000"
      - "6080:6080"
    networks:
      - bibliogenius-network

  # Same runtime image, but mounts dist/ so the packaged AppImage is tested as a
  # user receives it (entrypoint auto-detects *.AppImage and runs it FUSE-less).
  # Usage:
  #   make build-linux           # produces dist/BiblioGenius-Linux-x64.AppImage
  #   docker compose run --rm -d --service-ports linux-appimage
  #   ./verify_linux.sh 8043
  linux-appimage:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.linux-app
    container_name: bibliogenius-linux-appimage
    volumes:
      - ../dist:/app
    ports:
      - "8043:8000"
      - "6081:6080"
    networks:
      - bibliogenius-network

volumes:
  bibliogenius-data:
  hub-data:

networks:
  bibliogenius-network:
    driver: bridge
